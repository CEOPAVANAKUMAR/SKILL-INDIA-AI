/* ---- Photo banners (used on several panels) ---- */
.photo-banner{position:relative; border-radius:var(--radius-lg); overflow:hidden; min-height:148px; margin-bottom:16px; background:var(--navy-900); display:flex; align-items:center; box-shadow:var(--shadow-card);}
.photo-banner .pb-img{position:absolute; inset:0; background-size:cover; background-repeat:no-repeat;}
.photo-banner .pb-img.profile{background-image:var(--img-profile);}
.photo-banner .pb-img.team{background-image:var(--img-team);}
.photo-banner .pb-shade{position:absolute; inset:0; background:linear-gradient(100deg, var(--navy-900) 0%, rgba(13,19,39,.86) 32%, rgba(13,19,39,.18) 66%, transparent 100%);}
.photo-banner .pb-text{position:relative; z-index:1; padding:22px 26px; max-width:min(46ch,60%);}
.photo-banner h3{color:#fff; font-size:17px; margin:0 0 5px;}
.photo-banner p{color:#c3cae6; font-size:13px; margin:0;}
@media (max-width:700px){
  .photo-banner{min-height:176px; align-items:flex-end;}
  .photo-banner .pb-shade{background:linear-gradient(180deg, rgba(13,19,39,.15) 0%, rgba(13,19,39,.9) 100%);}
  .photo-banner .pb-text{max-width:100%; padding:18px;}
}
/* ---- Sign-in / sign-up: split layout with the team photo ---- */
.auth-modal{max-width:820px; padding:0; display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); overflow:hidden; max-height:calc(100vh - 40px);}
.am-art{position:relative; min-height:100%; background:var(--navy-900);}
.am-art .am-art-img{position:absolute; inset:0; background:var(--img-team) 30% 50%/cover no-repeat;}
.am-art .am-art-shade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(13,19,39,.05) 30%, rgba(13,19,39,.92) 100%);}
.am-art .am-art-copy{position:absolute; left:0; right:0; bottom:0; padding:22px 24px; color:#fff;}
.am-art .am-art-copy b{display:block; font-family:"Sora",sans-serif; font-size:17px; line-height:1.3; margin-bottom:5px;}
.am-art .am-art-copy span{display:block; font-size:12.5px; color:#c3cae6; line-height:1.5;}
.am-body{padding:28px 28px 22px; overflow-y:auto; min-width:0;}
@media (max-width:700px){
  .auth-modal{grid-template-columns:1fr; overflow-y:auto;}
  .am-art{min-height:132px; height:132px;}
  .am-art .am-art-img{background-position:32% 45%;}
  .am-art .am-art-copy{padding:14px 18px;}
  .am-art .am-art-copy span{display:none;}
  .am-body{overflow:visible; padding:22px 20px 20px;}
  .auth-modal .am-close{background:rgba(255,255,255,.92); width:30px; height:30px; display:flex; align-items:center; justify-content:center; z-index:2;}
}

/* ---- Full-page background: SkillMind AI artwork ---- */
:root{--card-bg:rgba(255,255,255,.93);}
.bg-decor{background:var(--navy-950);}
.bg-decor .wm-photo{inset:0; right:0; bottom:0; width:100%; height:100%; aspect-ratio:auto; border-radius:0; z-index:0;
  background-image:var(--wm-photo); background-size:cover; background-position:center center; background-repeat:no-repeat;
  opacity:1; filter:none; mask-image:none; -webkit-mask-image:none;}
.bg-decor .aurora{z-index:1; background-image:
  linear-gradient(180deg, rgba(8,11,28,.38) 0%, rgba(8,11,28,.58) 100%),
  radial-gradient(900px 600px at 50% 40%, transparent 0%, rgba(8,11,28,.22) 100%);}
.bg-decor .texture{z-index:1; opacity:.35;}
.bg-decor .wm-chip{z-index:2;}
/* text that sits straight on the background (not inside a card) */
.page-head h1{color:#fff; text-shadow:0 1px 14px rgba(8,11,28,.55);}
.page-head .lede{color:#d5dbf2; text-shadow:0 1px 10px rgba(8,11,28,.55);}
[id^="panel-body-"] > .spinner-row{color:#d5dbf2;}
.chat-suggest button{background:rgba(255,255,255,.92);}
.chat-suggest button:hover{background:var(--grad-accent);}
.mobile-topbar{background:rgba(13,19,39,.82) !important; border-bottom-color:var(--line-dark) !important;}
.mobile-topbar .mt-title{color:#fff;}
.hamburger-btn{background:rgba(255,255,255,.1) !important; border-color:var(--line-dark) !important; color:#fff;}
.hero-banner{box-shadow:0 0 0 1px rgba(124,156,252,.28), 0 18px 44px -18px rgba(0,0,0,.6);}
</style>
</head>

============================================================================ */
const API_BASE = (location.protocol === "http:" || location.protocol === "https:") ? location.origin : "http://localhost:8000";
const REQUEST_TIMEOUT_MS = 15000;

function getOrCreateProfileId(){
  try{
    let id = localStorage.getItem("skillmind_profile_id");
    if(!id){
      id = "p" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
      localStorage.setItem("skillmind_profile_id", id);
    }
    return id;
  }catch(_e){
    return "p" + Math.random().toString(36).slice(2, 12);
  }
}

  profileId: getOrCreateProfileId(),

/* ============================================================================
   Helpers
============================================================================ */
function escapeHtml(str){
  return String(str == null ? "" : str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function formatBytes(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/(1024*1024)).toFixed(1) + " MB";
}
function matchTier(pct){ return pct >= 75 ? "high" : pct >= 45 ? "med" : "low"; }
function tierLabel(tier){ return tier === "high" ? "High Match" : tier === "med" ? "Medium Match" : "Low Match"; }
function levelClass(level){ return (level || "Beginner").toLowerCase(); }
function byId(id){ return document.getElementById(id); }

class ApiError extends Error{ constructor(message, kind){ super(message); this.kind = kind; } }

async function apiRequest(path, options = {}){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  let res;
  try{
    res = await fetch(API_BASE + path, { ...options, signal: controller.signal });
  }catch(err){
    clearTimeout(timer);
    if(err.name === "AbortError") throw new ApiError("The request took too long to respond.", "timeout");
    throw new ApiError("Could not reach the analysis engine.", "network");
  }
  clearTimeout(timer);
  let bodyText = "";
  try{ bodyText = await res.text(); }catch(_e){}
  if(!res.ok){
    let detail = "";
    try{ const parsed = bodyText ? JSON.parse(bodyText) : null; detail = (parsed && (parsed.detail || parsed.message)) || ""; }catch(_e){}
    throw new ApiError(detail || `Request failed (HTTP ${res.status}).`, "http");
  }
  if(!bodyText) throw new ApiError("The server returned an empty response.", "parse");
  try{ return JSON.parse(bodyText); }catch(_e){ throw new ApiError("The server returned an unreadable response.", "parse"); }
}
function apiGet(path){ return apiRequest(path, { method: "GET" }); }
function apiPost(path, body){
  return apiRequest(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}
function friendlyApiMessage(err){
  if(err instanceof ApiError){
    if(err.kind === "network" || err.kind === "timeout") return "SkillMind AI couldn't connect to the analysis engine. Make sure the backend is running at localhost:8000.";
    return err.message || "Something went wrong talking to the analysis engine.";
  }
  return "Something unexpected went wrong.";
}
function showToast(message, isError){
  const stack = byId("toastStack");
  const t = document.createElement("div");
  t.className = "toast" + (isError ? " error" : "");
  t.innerHTML = `<span style="flex:none;margin-top:1px;">${isError ? ICONS.alert : ICONS.check}</span><span>${escapeHtml(message)}</span>`;
  stack.appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .3s ease"; t.style.opacity = "0"; setTimeout(() => t.remove(), 300); }, 4200);
}
function inlineErrorBlock(message, retryFn){
  const id = "retry-" + Math.random().toString(36).slice(2, 9);
  setTimeout(() => { const btn = byId(id); if(btn) btn.addEventListener("click", retryFn); }, 0);
  return `<div class="inline-error"><span class="ie-icon">${ICONS.alert}</span><div>${escapeHtml(message)}</div><button class="btn secondary sm" id="${id}">Retry</button></div>`;
}
function spinnerRow(text){ return `<div class="spinner-row"><div class="spinner"></div>${escapeHtml(text)}</div>`; }

/* ============================================================================
   AUTH / SIGN IN — optional email+password account on top of the existing
   guest profile_id flow. Signing in swaps state.profileId for the profile_id
   tied to the account (so the same data is reachable from any browser) and
   re-hydrates state.skills from whatever that profile already has saved.
============================================================================ */
function authRequest(path, body){
  return apiRequest(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(state.authToken ? { "Authorization": "Bearer " + state.authToken } : {}) },
    body: JSON.stringify(body || {}),
  });
}
function getInitials(nameOrEmail){
  const s = (nameOrEmail || "").trim();
  if(!s) return "?";
  const parts = s.split(/\s+/);
  if(parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return s.slice(0, 2).toUpperCase();
}
function renderAccountBox(){
  const box = byId("accountBox");
  if(!box) return;
  if(state.user){
    const label = state.user.name || state.user.email;
    box.innerHTML = `
      <div class="acc-signedin">
        <div class="acc-avatar">${escapeHtml(getInitials(label))}</div>
        <div class="acc-info">
          <div class="acc-name">${escapeHtml(state.user.name || "Signed in")}</div>
          <div class="acc-email">${escapeHtml(state.user.email)}</div>
        </div>
        <button class="acc-signout-btn" id="acc-signout-btn">Sign out</button>
      </div>`;
    byId("acc-signout-btn").addEventListener("click", signOut);
  }else{
    box.innerHTML = `
      <div class="acc-signedout">
        <span class="acc-label">Using a guest profile</span>
        <button class="acc-signin-btn" id="acc-signin-btn">Sign in</button>
      </div>`;
    byId("acc-signin-btn").addEventListener("click", () => openAuthModal("login"));
  }
}
async function hydrateProfileFromServer(){
  try{
    const data = await apiGet(`/api/profile/${encodeURIComponent(state.profileId)}`);
    state.skills = new Set((data.skills || []).map(s => s.skill_key));
    updateNavAvailability();
    showPanel(currentPanel);
  }catch(_err){
    // No saved profile yet for this account (e.g. brand-new signup) — that's fine.
  }
}
async function tryRestoreSession(){
  const token = localStorage.getItem("skillmind_auth_token");
  if(!token) return;
  state.authToken = token;
  try{
    const res = await apiRequest("/api/auth/me", { headers: { "Authorization": "Bearer " + token } });
    applySignedInUser(res.user);
    await hydrateProfileFromServer();
  }catch(_err){
    state.authToken = null;
    try{ localStorage.removeItem("skillmind_auth_token"); }catch(_e){}
  }
}
function applySignedInUser(user){
  state.user = user;
  state.profileId = user.profile_id;
  try{
    localStorage.setItem("skillmind_auth_token", state.authToken);
    localStorage.setItem("skillmind_profile_id", state.profileId);
  }catch(_e){}
  renderAccountBox();
}
async function signOut(){
  try{ if(state.authToken) await authRequest("/api/auth/logout", {}); }catch(_e){}
  state.authToken = null;
  state.user = null;
  try{ localStorage.removeItem("skillmind_auth_token"); }catch(_e){}
  showToast("Signed out. You're back on a guest profile.");
  renderAccountBox();
}

let authMode = "login";
function openAuthModal(mode){
  authMode = mode || "login";
  renderAuthModal();
  byId("authBackdrop").classList.add("show");
}
function closeAuthModal(){ byId("authBackdrop").classList.remove("show"); }
function renderAuthModal(errorMsg){
  const isLogin = authMode === "login";
  byId("authModal").innerHTML = `
    <button class="am-close" id="am-close" aria-label="Close">✕</button>
    <div class="am-art" aria-hidden="true">
      <div class="am-art-img"></div><div class="am-art-shade"></div>
      <div class="am-art-copy"><b>See where you stand, then close the gaps.</b><span>Your resume, skill gaps, lessons and job readiness stay together in one workspace.</span></div>
    </div>
    <div class="am-body">
    <h2>${isLogin ? "Sign in" : "Create your account"}</h2>
    <p class="am-sub">${isLogin ? "Pick up your profile, skills and progress from any device." : "Save your progress so you can come back to it from anywhere."}</p>
    <form id="authForm">
      ${isLogin ? "" : `<label for="am-name">Name</label><input id="am-name" type="text" autocomplete="name" placeholder="Your name">`}
      <label for="am-email">Email</label>
      <input id="am-email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="am-password">Password</label>
      <input id="am-password" type="password" autocomplete="${isLogin ? "current-password" : "new-password"}" placeholder="${isLogin ? "Your password" : "At least 6 characters"}" required minlength="6">
      ${errorMsg ? `<div class="am-error">${escapeHtml(errorMsg)}</div>` : ""}
      <button type="submit" class="btn primary am-submit" id="am-submit">${isLogin ? "Sign in" : "Create account"}</button>
    </form>
    <div class="am-switch">
      ${isLogin ? `Don't have an account? <button id="am-switch-btn">Sign up</button>` : `Already have an account? <button id="am-switch-btn">Sign in</button>`}
    </div>
    <div class="am-guest-note">You can keep using SkillMind without an account — nothing here is required.</div>
    </div>
  `;
  byId("am-close").addEventListener("click", closeAuthModal);
  byId("am-switch-btn").addEventListener("click", () => openAuthModal(isLogin ? "signup" : "login"));
  byId("authForm").addEventListener("submit", handleAuthSubmit);
}
byId("authBackdrop").addEventListener("click", (e) => { if(e.target.id === "authBackdrop") closeAuthModal(); });

async function handleAuthSubmit(e){
  e.preventDefault();
  const email = byId("am-email").value.trim();
  const password = byId("am-password").value;
  const name = authMode === "signup" ? (byId("am-name").value || "").trim() : "";
  const btn = byId("am-submit");
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = authMode === "login" ? "Signing in…" : "Creating account…";
  try{
    const path = authMode === "login" ? "/api/auth/login" : "/api/auth/signup";
    const res = await authRequest(path, { email, password, name });
    state.authToken = res.token;
    applySignedInUser(res.user);
    closeAuthModal();
    showToast(authMode === "login" ? "Welcome back!" : "Account created — you're signed in.");
    await hydrateProfileFromServer();
  }catch(err){
    renderAuthModal(friendlyApiMessage(err));
  }finally{
    if(byId("am-submit")){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

function renderNav(){
  const root = byId("navScroll");
  root.innerHTML = NAV.map(group => `
    <div class="nav-group-label">${escapeHtml(group.group)}</div>
    ${group.items.map(item => `
      <button class="nav-item${item.id === "overview" ? " active" : ""}" data-panel="${item.id}" ${item.alwaysOn ? "" : "disabled"}>
        ${ICONS[item.icon]}
        ${escapeHtml(item.label)}
        ${item.alwaysOn ? "" : `<span class="lock">${ICONS.lock}</span>`}
      </button>
    `).join("")}
  `).join("");
  root.querySelectorAll(".nav-item[data-panel]").forEach(btn => {
    btn.addEventListener("click", () => { if(!btn.disabled) showPanel(btn.dataset.panel); });
  });
}

function openMobileDrawer(){ byId("sidebar").classList.add("open"); byId("sidebarOverlay").classList.add("show"); }
function closeMobileDrawer(){ byId("sidebar").classList.remove("open"); byId("sidebarOverlay").classList.remove("show"); }

function updateNavAvailability(){
  const has = state.skills.size > 0;
  const justUnlocked = has && !state.hasEverHadSkills;
  document.querySelectorAll(".nav-item[data-panel]").forEach(btn => {
    const navItem = NAV.flatMap(g => g.items).find(i => i.id === btn.dataset.panel);
    if(navItem && navItem.alwaysOn) return;
    const wasDisabled = btn.disabled;
    btn.disabled = !has;
    if(wasDisabled && has && justUnlocked){ btn.classList.add("just-unlocked"); setTimeout(() => btn.classList.remove("just-unlocked"), 800); }
  });
  if(has) state.hasEverHadSkills = true;
  byId("railSkillCount").textContent = state.skills.size;
  byId("railSkillHint").textContent = has ? "Journey unlocked — explore the sidebar" : "Upload a resume to begin";
  byId("railProgressFill").style.width = Math.min(100, state.skills.size * 8) + "%";
}

function careerSelectHtml(id){
  if(!state.careers.length) return `<select id="${id}"></select>`;
  const sel = state.targetCareer || state.careers[0].key;
  return `<select id="${id}">${state.careers.map(c => `<option value="${c.key}" ${c.key===sel?"selected":""}>${escapeHtml(c.label)}</option>`).join("")}</select>`;

}

async function handleResumeFile(file){
  renderFileChip(file);
  const resultBox = byId("uploadResult");
  resultBox.innerHTML = `<div class="upload-state"><div class="us-loading"><div class="spinner"></div>Running NLP pipeline: extracting text → sections → skills → evidence…</div></div>`;

  const allowed = [".pdf", ".docx", ".txt"];
  if(!allowed.some(ext => file.name.toLowerCase().endsWith(ext))){
    resultBox.innerHTML = `<div class="upload-state"><div class="us-error">Unsupported file type. Please upload a PDF, DOCX, or TXT file.</div></div>`;
    return;
  }
  const form = new FormData();
  form.append("file", file);
  form.append("profile_id", state.profileId);

  try{
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
    let res;
    try{ res = await fetch(API_BASE + "/api/resume/upload", { method: "POST", body: form, signal: controller.signal }); }
    finally{ clearTimeout(timer); }
    const bodyText = await res.text();
    if(!res.ok){
      let detail = ""; try{ detail = (JSON.parse(bodyText) || {}).detail || ""; }catch(_e){}
      throw new Error(detail || "We couldn't read that file. Please try again.");
    }
    const profile = bodyText ? JSON.parse(bodyText) : {};
    if(profile.profile_id) state.profileId = profile.profile_id;
    try{ localStorage.setItem("skillmind_profile_id", state.profileId); }catch(_e){}

    profile.extracted_skills.forEach(key => state.skills.add(key));
    state.lastResumeProfile = profile;
    updateNavAvailability();

    resultBox.innerHTML = `<div class="upload-state"><div class="us-success"><div style="display:flex; align-items:center; gap:8px; font-weight:700; color:var(--green-text);">${ICONS.check} Resume analyzed successfully — ${profile.extracted_skill_labels.length} skills detected</div></div></div>`;
    renderProfileDetail(profile);
  }catch(err){
    const msg = err.name === "AbortError" ? "That took too long to process. Please try again." : (err.message || "We couldn't read that file. Please try again.");
    resultBox.innerHTML = `<div class="upload-state"><div class="us-error">${escapeHtml(msg)}</div></div>`;
  }
}

function labelFor(key){ return (state.skillMeta[key] && state.skillMeta[key].label) || key; }

function renderProfileDetail(profile){
  const box = byId("profileDetailCard");
  if(!box) return;
  const fields = [];
  if(profile.name) fields.push(`<div class="pf"><span class="pflabel">Name</span><b>${escapeHtml(profile.name)}</b></div>`);
  if(profile.email) fields.push(`<div class="pf"><span class="pflabel">Email</span><b>${escapeHtml(profile.email)}</b></div>`);
  if(profile.phone) fields.push(`<div class="pf"><span class="pflabel">Phone</span><b>${escapeHtml(profile.phone)}</b></div>`);
  if(profile.degree) fields.push(`<div class="pf"><span class="pflabel">Degree</span><b>${escapeHtml(profile.degree)}</b></div>`);
  if(profile.branch) fields.push(`<div class="pf"><span class="pflabel">Branch</span><b>${escapeHtml(profile.branch)}</b></div>`);
  if(profile.grad_year) fields.push(`<div class="pf"><span class="pflabel">Grad Year</span><b>${escapeHtml(profile.grad_year)}</b></div>`);

  const evidenceRows = (profile.extracted_skills || []).map(key => {
    const lvl = (profile.skill_levels || {})[key] || {level:"Beginner", confidence:40, evidence:[]};
    const label = labelFor(key) || key;
    return `<div class="evidence-row"><div class="ev-left"><div class="ev-name">${escapeHtml(label)} <span class="level-badge ${levelClass(lvl.level)}">${escapeHtml(lvl.level)}</span></div>
      <div class="ev-detail">${escapeHtml((lvl.evidence||[]).join(" · "))}</div></div>
      <div class="confidence-bar" title="Confidence ${lvl.confidence||0}%"><div class="fill" style="width:${lvl.confidence||0}%;"></div></div></div>`;
  }).join("");

  box.innerHTML = `
    <div class="card">
      <h3 style="font-size:15px;">Your Current Profile</h3>
      <div class="profile-fields">${fields.join("") || `<span style="color:var(--muted); font-size:13px;">No contact details detected.</span>`}</div>
      ${profile.sections_detected && profile.sections_detected.length ? `<p style="font-size:12px; color:var(--muted); margin-top:8px;">Sections detected: ${profile.sections_detected.map(escapeHtml).join(", ")}</p>` : ""}
    </div>
    ${profile.projects && profile.projects.length ? `<div class="card"><h3 style="font-size:14px;">Projects detected</h3><ul class="item-list">${profile.projects.map(p => `<li>${ICONS.check}${escapeHtml(p)}</li>`).join("")}</ul></div>` : ""}
    ${profile.certifications && profile.certifications.length ? `<div class="card"><h3 style="font-size:14px;">Certifications detected</h3><ul class="item-list">${profile.certifications.map(p => `<li>${ICONS.check}${escapeHtml(p)}</li>`).join("")}</ul></div>` : ""}
    <div class="card">
      <h3 style="font-size:15px;">Estimated Skill Levels <span style="font-weight:400; font-size:12px; color:var(--muted-light);">(evidence-based, not exact expertise)</span></h3>
      ${evidenceRows || `<p style="color:var(--muted); font-size:13px;">No skills detected yet.</p>`}
    </div>
    ${profile.resume_tips && profile.resume_tips.length ? `<div class="card"><h3 style="font-size:14px;">Resume improvement tips</h3><ul class="tips-list">${profile.resume_tips.map(t => `<li>${ICONS.alert}${escapeHtml(t)}</li>`).join("")}</ul></div>` : ""}

async function loadSkillCatalog(){
  try{
    const data = await apiGet("/api/skills");
    Object.entries(data.categories).forEach(([category, skills]) => skills.forEach(s => state.skillMeta[s.key] = { label: s.label, category }));
    _skillCatalogCache = data.categories;
    if(currentPanel === "skills") renderSkillPicker(data.categories, "");
  }catch(err){
    const picker = byId("skillPicker");
    if(picker) picker.innerHTML = inlineErrorBlock(friendlyApiMessage(err), loadSkillCatalog);
  }
}
function renderSkillPicker(categories, query){
  if(categories) _skillCatalogCache = categories;
  const source = _skillCatalogCache;
  const picker = byId("skillPicker");
  if(!source || !picker) return;
  const q = (query || "").trim().toLowerCase();
  picker.innerHTML = "";
  let anyVisible = false;
  Object.entries(source).forEach(([category, skills]) => {
    const filtered = q ? skills.filter(s => s.label.toLowerCase().includes(q)) : skills;
    if(!filtered.length) return;
    anyVisible = true;
    const group = document.createElement("div");
    group.className = "picker-group";
    const grid = filtered.map(s => `<button type="button" class="chip-toggle${state.skills.has(s.key) ? " on" : ""}" id="chip-${s.key}" data-key="${s.key}">${escapeHtml(s.label)}</button>`).join("");
    group.innerHTML = `<h4>${escapeHtml(category)}</h4><div class="chip-grid">${grid}</div>`;
    picker.appendChild(group);
  });
  if(!anyVisible) picker.innerHTML = `<div class="no-results">No skills match "${escapeHtml(query)}".</div>`;
  picker.querySelectorAll(".chip-toggle").forEach(btn => btn.addEventListener("click", () => toggleSkill(btn.dataset.key, !state.skills.has(btn.dataset.key))));
}
function renderSelectedBar(){
  const bar = byId("selectedBar");
  if(!bar) return;
  const countEl = byId("selectedCount");
  if(countEl) countEl.textContent = state.skills.size;
  if(state.skills.size === 0){ bar.innerHTML = '<span class="empty-note">No skills selected yet — upload a resume or pick some below.</span>'; return; }
  bar.innerHTML = "";
  [...state.skills].sort((a, b) => labelFor(a).localeCompare(labelFor(b))).forEach(key => {
    const label = labelFor(key);
    const chip = document.createElement("span");
    chip.className = "chip-selected";
    chip.innerHTML = `${escapeHtml(label)} <button aria-label="Remove ${escapeHtml(label)}">×</button>`;
    chip.querySelector("button").addEventListener("click", () => toggleSkill(key, false));
    bar.appendChild(chip);
  });
}
function toggleSkill(key, on){
  if(on) state.skills.add(key); else state.skills.delete(key);
  const chipBtn = byId("chip-" + key);
  if(chipBtn) chipBtn.classList.toggle("on", state.skills.has(key));
  renderSelectedBar(); updateNavAvailability();
  if(on) apiPost(`/api/profile/${encodeURIComponent(state.profileId)}/skills`, { skills: [...state.skills] }).catch(() => {});
}
function highlightSkillInPicker(key){
  showPanel("skills");
  setTimeout(() => {
    const chip = byId("chip-" + key);
    if(chip){ chip.scrollIntoView({ behavior: "smooth", block: "center" }); chip.classList.add("flash"); setTimeout(() => chip.classList.remove("flash"), 1000); }
  }, 150);
}

/* ---------------------------- helpers: rings ---------------------------- */
function ringSvg(pct, size, stroke, color){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, offset = c * (1 - pct / 100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c}" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);" data-target-offset="${offset}"/>
  </svg>`;
}
function animateRings(container){ requestAnimationFrame(() => container.querySelectorAll("circle[data-target-offset]").forEach(c => c.style.strokeDashoffset = c.dataset.targetOffset)); }
function tierColor(tier){ return tier === "high" ? "var(--green)" : tier === "med" ? "var(--blue)" : "var(--amber)"; }

async function renderAssessDetail(skillKey){
  const box = byId("assessDetail");
  if(!box) return;
  box.innerHTML = spinnerRow("Loading questions…");
  try{
    const quiz = await apiGet(`/api/assessment/${encodeURIComponent(skillKey)}`);
    box.innerHTML = `<div class="card">
      <h3 style="font-size:15px;">Assessment: ${escapeHtml(labelFor(skillKey))}</h3>
      <div id="quizQuestions">${quiz.questions.map((q, i) => renderQuizQuestion(q, i)).join("")}</div>
      <div class="btn-row"><button class="btn primary" id="submitQuizBtn">Submit Test</button></div>
      <div id="quizResult"></div>
    </div>`;
    wireQuizOptions();
    byId("submitQuizBtn").addEventListener("click", () => submitQuiz(skillKey));
  }catch(err){ box.innerHTML = `<div class="card">${inlineErrorBlock(friendlyApiMessage(err), () => renderAssessDetail(skillKey))}</div>`; }
}
function renderQuizQuestion(q, idx){
  return `<div class="quiz-q" data-qid="${q.id}">
    <div class="qtag">${escapeHtml(q.type.replace('_',' '))} · ${escapeHtml(q.topic.replace('_',' '))}</div>
    <div class="qprompt">${idx+1}. ${escapeHtml(q.prompt)}</div>
    ${q.options.map((opt, oi) => `<button type="button" class="quiz-option" data-qid="${q.id}" data-oi="${oi}">${escapeHtml(opt)}</button>`).join("")}
  </div>`;
}
function wireQuizOptions(){
  document.querySelectorAll(".quiz-option").forEach(btn => {
    btn.addEventListener("click", () => {
      const qid = btn.dataset.qid;
      document.querySelectorAll(`.quiz-option[data-qid="${qid}"]`).forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      state.quizAnswers[qid] = parseInt(btn.dataset.oi, 10);
    });
  });
}
async function submitQuiz(skillKey){
  const answered = Object.keys(state.quizAnswers).length;
  const total = document.querySelectorAll(".quiz-q").length;
  if(answered < total){ showToast(`Answer all ${total} questions first (${answered}/${total} done).`, true); return; }
  const btn = byId("submitQuizBtn");
  btn.disabled = true; btn.textContent = "Grading…";
  try{
    const result = await apiPost(`/api/assessment/${encodeURIComponent(skillKey)}/submit`, { profile_id: state.profileId, answers: state.quizAnswers });
    result.detail.forEach(d => {
      const qEl = document.querySelector(`.quiz-q[data-qid="${d.id}"]`);
      if(!qEl) return;
      qEl.querySelectorAll(".quiz-option").forEach((optBtn, oi) => {
        optBtn.disabled = true;
        if(oi === d.correct_index) optBtn.classList.add("correct");
        else if(optBtn.classList.contains("selected") && !d.correct) optBtn.classList.add("incorrect");
      });
      qEl.insertAdjacentHTML("beforeend", `<div class="quiz-explain">${escapeHtml(d.explanation)}</div>`);
    });
    const actionColor = result.action === "advance" ? "var(--green-text)" : result.action === "practice" ? "var(--amber-text)" : "var(--red-text)";
    byId("quizResult").innerHTML = `<div class="card" style="margin-top:14px; border-color:${actionColor};">
      <div class="score-ring-wrap">
        ${ringSvg(result.score, 110, 10, actionColor)}
        <div>
          <div style="font-family:'Sora'; font-size:26px; font-weight:800;">${result.score}%</div>
          <div style="font-size:13px; color:var(--muted);">${result.correct_count}/${result.total} correct</div>
          <p style="margin-top:8px; font-size:13px; font-weight:600; color:${actionColor};">${escapeHtml(result.recommendation)}</p>
        </div>
      </div>
      ${result.strengths.length ? `<div class="lb-label" style="margin-top:12px;">Strengths</div><div class="tag-row">${result.strengths.map(t => `<span class="tag-matched">${escapeHtml(t.replace('_',' '))}</span>`).join("")}</div>` : ""}
      ${result.weaknesses.length ? `<div class="lb-label" style="margin-top:10px;">Needs work</div><div class="tag-row">${result.weaknesses.map(t => `<span class="tag-missing" style="cursor:default;">${escapeHtml(t.replace('_',' '))}</span>`).join("")}</div>` : ""}
    </div>`;
    animateRings(byId("quizResult"));
    btn.style.display = "none";
    showToast("Assessment graded — your skill mastery has been updated.");
  }catch(err){ showToast(friendlyApiMessage(err), true); btn.disabled = false; btn.textContent = "Submit Test"; }
}

  const filtered = _jobFilter === "all" ? rows : rows.filter(r => matchTier(r.match) === _jobFilter);
  const tabs = ["all","high","med","low"].map(t => `<button class="filter-tab${_jobFilter===t?" on":""}" data-tier="${t}">${t==="all"?"All":tierLabel(t)}</button>`).join("");
  if(!rows.length){ box.innerHTML = `<div class="card"><div class="empty-state"><h3>No jobs to show</h3><p>Add skills first.</p></div></div>`; return; }
  box.innerHTML = `${photoBanner("profile", "Roles that fit your profile", "Postings are ranked by how much of the required skill set you already cover.", "50% 20%")}<div class="banner" style="background:#eef1ff; border-color:#ddd6fe; color:var(--violet); margin-bottom:12px;">${ICONS.briefcase}<div>${escapeHtml(rows[0].data_source)}</div></div>
    <div class="filter-tabs">${tabs}</div>
    ${!filtered.length ? `<div class="card"><div class="empty-state"><h3>No matches in this range</h3></div></div>` : filtered.map(r => {
      const tier = matchTier(r.match);
      return `<div class="job-card">
        <div class="job-card-head">
          <div class="jc-badge ${tier}">${r.match}%</div>
          <div class="jc-main"><div class="jc-title">${escapeHtml(r.title)}</div><div class="jc-sub">${escapeHtml(r.company)} · ${escapeHtml(state.careerLabelByKey[r.career] || r.career)} · ${escapeHtml(r.readiness_status)}</div></div>
          <div class="jc-chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div>
        </div>
        <div class="job-detail"><div class="job-detail-inner">
          <div class="jd-col-title">Matched skills</div><div class="tag-row">${r.matched_skills.map(s => `<span class="tag-matched">${escapeHtml(s)}</span>`).join("") || "<span style='color:var(--muted); font-size:13px;'>None yet</span>"}</div>
          <div class="jd-col-title">Missing skills</div><div class="tag-row">${r.missing_skills.map(s => `<span class="tag-missing" style="cursor:default;">${escapeHtml(s)}</span>`).join("") || "<span style='color:var(--muted); font-size:13px;'>None — full match!</span>"}</div>
          <div class="jd-col-title">Recommended action</div><p style="font-size:12.5px; margin:0;">${escapeHtml(r.recommended_action)}</p>
        </div></div>
      </div>`;
    }).join("")}`;
  box.querySelectorAll(".filter-tab").forEach(tab => tab.addEventListener("click", () => { _jobFilter = tab.dataset.tier; renderJobCards(rows, box); }));
  box.querySelectorAll(".job-card-head").forEach(head => head.addEventListener("click", () => head.parentElement.classList.toggle("open")));
}

/* ---------------------------- RESUME IMPROVEMENT ---------------------------- */
RENDERERS.improve = function(){
  const root = byId("panel-body-improve");
  root.innerHTML = `${photoBanner("profile", "Tighten your resume with fresh eyes", "See your strengths, missing sections and weak project descriptions, with fixes you can apply.", "70% 88%")}<div class="card"><label class="field-label">Target career (optional — for skill gap-aware suggestions)</label>${careerSelectHtml("improveCareerSelect")}
    <div class="btn-row"><button class="btn primary" id="runImproveBtn">Re-analyze My Resume</button></div></div>
    <div id="improveResult" style="margin-top:14px;"></div>`;
  byId("runImproveBtn").addEventListener("click", runImprove);
};
async function runImprove(){
  const box = byId("improveResult");
  box.innerHTML = spinnerRow("Analyzing strengths, gaps, and weak spots…");
  const career = byId("improveCareerSelect") ? byId("improveCareerSelect").value : null;
  try{
    const r = await apiPost("/api/resume/reanalyze", { profile_id: state.profileId, target_career: career });
    box.innerHTML = `<div class="card">
      ${r.strengths.length ? `<div class="gap-section-title have">${ICONS.check} Strengths</div><ul class="item-list">${r.strengths.map(s => `<li>${ICONS.check}${escapeHtml(s)}</li>`).join("")}</ul>` : ""}
      ${r.missing_sections.length ? `<div class="gap-section-title develop">Missing sections</div><div class="tag-row">${r.missing_sections.map(s => `<span class="tag-missing" style="cursor:default;">${escapeHtml(s)}</span>`).join("")}</div>` : ""}
      ${r.weak_project_descriptions.length ? `<div class="gap-section-title develop">Weak project descriptions</div><ul class="item-list">${r.weak_project_descriptions.map(s => `<li>${ICONS.alert}${escapeHtml(s)}</li>`).join("")}</ul>` : ""}
      <div class="gap-section-title">Recommended improvements</div><ul class="tips-list">${r.recommended_improvements.map(t => `<li>${ICONS.alert}${escapeHtml(t)}</li>`).join("")}</ul>
    </div>`;
  }catch(err){ box.innerHTML = `<div class="card">${inlineErrorBlock(friendlyApiMessage(err), runImprove)}</div>`; }
}

/* ---------------------------- AI ASSISTANT (chat) ---------------------------- */
/* Preserves the original SkillMind chatbot (/api/chat, LLM-backed with a
   rule-based fallback — unchanged in llm_chat.py / recommender.py) behind
   a proper chat UI, always reachable regardless of profile/journey state. */
let _chatHistory = [];
let _chatBusy = false;
RENDERERS.assistant = function(){
  const root = byId("panel-body-assistant");
  root.innerHTML = `
    ${photoBanner("team", "Ask about your skills, careers or next steps", "Pick a suggestion below or type your own question.", "50% 32%")}
    <div class="chat-suggest" id="chatSuggest">
      <button data-q="What skills should I learn next?">What skills should I learn next?</button>
      <button data-q="What career matches my profile?">What career matches my profile?</button>
      <button data-q="Explain my biggest skill gap">Explain my biggest skill gap</button>
      <button data-q="Tell me about RAG">Tell me about RAG</button>
      <button data-q="How can I improve my resume?">How can I improve my resume?</button>
    </div>
    <div class="chat-window">
      <div class="chat-thread" id="chatThread"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Ask a question…" autocomplete="off">
        <button class="btn primary" id="chatSendBtn">${ICONS.send} Send</button>
      </div>
    </div>
  `;
  const thread = byId("chatThread");
  if(_chatHistory.length){
    _chatHistory.forEach(m => appendBubble(m.role, m.text, m.source));
  }else{
    appendBubble("assistant", "Hi — I can walk you through career fit, missing skills, your roadmap, or specific technologies. Try a suggestion above, or ask your own question.");
  }
  byId("chatSendBtn").addEventListener("click", () => sendChat(byId("chatInput").value));
  byId("chatInput").addEventListener("keydown", (e) => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat(e.target.value); } });
  byId("chatSuggest").querySelectorAll("button").forEach(b => b.addEventListener("click", () => sendChat(b.dataset.q)));
};
function appendBubble(role, text, source){
  const thread = byId("chatThread");
  if(!thread) return null;
  const row = document.createElement("div");
  row.className = "msg-row " + role;
  row.innerHTML = `<div class="msg-avatar ${role}">${role === "assistant" ? ICONS.message : ICONS.userDot}</div>`;
  const wrap = document.createElement("div");
  const bubble = document.createElement("div");
  bubble.className = "bubble " + role;
  bubble.textContent = text; // textContent only, never innerHTML, to avoid any injection
  wrap.appendChild(bubble);
  if(role === "assistant" && source){
    const tag = document.createElement("div");
    tag.className = "chat-source-tag";
    tag.textContent = source === "llm" ? "AI-generated" : "Rule-based (offline fallback)";
    wrap.appendChild(tag);
  }
  row.appendChild(wrap);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
  return bubble;
}
function showTyping(){
  const thread = byId("chatThread");
  if(!thread) return;
  const row = document.createElement("div");
  row.className = "typing-row"; row.id = "typingRow";
  row.innerHTML = `<div class="msg-avatar assistant">${ICONS.message}</div><div class="typing-dots"><span></span><span></span><span></span></div>`;
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
}
function hideTyping(){ const row = byId("typingRow"); if(row) row.remove(); }
async function sendChat(message){
  if(!message.trim() || _chatBusy) return;
  _chatBusy = true;
  const input = byId("chatInput"), sendBtn = byId("chatSendBtn");
  if(input) input.disabled = true;
  if(sendBtn) sendBtn.disabled = true;
  appendBubble("user", message);
  _chatHistory.push({role: "user", text: message});
  if(input) input.value = "";
  showTyping();
  try{
    const res = await apiPost("/api/chat", { message, skills: [...state.skills] });
    hideTyping();
    appendBubble("assistant", res.reply, res.source);
    _chatHistory.push({role: "assistant", text: res.reply, source: res.source});
  }catch(err){
    hideTyping();
    const bubble = appendBubble("assistant", friendlyApiMessage(err));
    if(bubble) bubble.classList.add("error");
  }finally{
    _chatBusy = false;
    if(input){ input.disabled = false; input.focus(); }
    if(sendBtn) sendBtn.disabled = false;
  }
}

   INIT
============================================================================ */
async function loadCareerOptions(){
  try{
    state.careers = await apiGet("/api/careers");
    state.careerLabelByKey = {};
    state.careers.forEach(c => state.careerLabelByKey[c.key] = c.label);
    if(!state.targetCareer && state.careers.length) state.targetCareer = state.careers[0].key;
  }catch(err){ showToast(friendlyApiMessage(err), true); }
}
async function bootstrapCatalogs(){
  await Promise.all([loadSkillCatalog(), loadCareerOptions()]);
  updateNavAvailability();
}

(async function init(){
  renderNav();
  renderAccountBox();
  showPanel("overview");
  const healthy = await checkHealth();
  await bootstrapCatalogs();
  if(healthy){
    await tryRestoreSession();
    showPanel("overview");
  }
})();
</script>
